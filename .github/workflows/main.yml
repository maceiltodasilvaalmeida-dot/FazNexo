name: Compilar APKs FazNexo 4.0

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'ANDROID/**'
      - '.github/workflows/compilar-apks.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ANDROID/FazNexo-Apps

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar Cliente e Profissional
        run: gradle :cliente:assembleDebug :profissional:assembleDebug --stacktrace

      - name: Organizar APKs
        run: |
          mkdir -p ../../APKS-PRONTOS
          cp cliente/build/outputs/apk/debug/faznexo-cliente.apk ../../APKS-PRONTOS/faznexo-cliente.apk
          cp profissional/build/outputs/apk/debug/faznexo-profissional.apk ../../APKS-PRONTOS/faznexo-profissional.apk

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: FazNexo-4.0-APKs
          path: APKS-PRONTOS/*.apk
          if-no-files-found: error
          retention-days: 30
